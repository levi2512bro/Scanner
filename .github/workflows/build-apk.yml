name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK als Download veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Scanner.apk
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste Scanner.apk --title "Scanner – neueste Version" --notes "Scanner.apk antippen, herunterladen und installieren."
